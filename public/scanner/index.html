<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0014"/>
<title>Summer Fest 2026 – Gate Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0014;
  --surface: rgba(18, 0, 42, 0.7);
  --glass: rgba(255,255,255,0.05);
  --glass-border: rgba(255,255,255,0.12);
  --accent: #7c3aed;
  --accent2: #a855f7;
  --green: #10b981;
  --red: #ef4444;
  --yellow: #f59e0b;
  --text: #f0e6ff;
  --text2: #a78bca;
  --border: rgba(124,58,237,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(124,58,237,0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(168,85,247,0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(76,29,149,0.15) 0%, transparent 70%);
  background-attachment: fixed;
}

/* ─── LOGIN SCREEN ──────────────────────────────────────── */
#scanner-login {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px 16px;
}

.login-logo {
  margin-bottom: 28px; text-align: center;
}
.login-logo .badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(124,58,237,0.2);
  border: 1px solid rgba(124,58,237,0.4);
  border-radius: 40px; padding: 6px 16px;
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--accent2);
  margin-bottom: 12px;
}
.login-logo h1 {
  font-size: 28px; font-weight: 900; color: #fff;
  background: linear-gradient(135deg, #fff 0%, #c084fc 50%, #ffd700 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-logo p { font-size: 13px; color: var(--text2); margin-top: 4px; }

/* Glass card */
.login-card {
  width: 100%; max-width: 380px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 28px 24px;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.4),
    0 0 0 1px rgba(124,58,237,0.2) inset,
    0 1px 0 rgba(255,255,255,0.1) inset;
}

.login-card label {
  display: block; font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text2); margin-bottom: 6px;
}
.login-card input {
  width: 100%; padding: 13px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; color: var(--text);
  font-size: 15px; font-family: inherit; outline: none;
  transition: border-color 0.2s, background 0.2s;
  -webkit-appearance: none;
}
.login-card input::placeholder { color: rgba(167,139,202,0.5); }
.login-card input:focus {
  border-color: var(--accent);
  background: rgba(124,58,237,0.08);
}
.field { margin-bottom: 16px; }

.login-btn {
  width: 100%; padding: 14px; margin-top: 8px;
  background: linear-gradient(135deg, #6d28d9, #7c3aed, #8b5cf6);
  border: none; border-radius: 12px;
  color: #fff; font-size: 15px; font-weight: 700;
  font-family: inherit; cursor: pointer; letter-spacing: 0.3px;
  box-shadow: 0 4px 20px rgba(124,58,237,0.4);
  transition: opacity 0.2s, transform 0.1s;
  -webkit-appearance: none;
}
.login-btn:active { transform: scale(0.98); opacity: 0.9; }
.login-btn:disabled { opacity: 0.6; cursor: wait; }

.s-err {
  margin-top: 12px; padding: 10px 14px;
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
  border-radius: 10px; color: #fca5a5; font-size: 13px;
  text-align: center; display: none;
}
.s-err.show { display: block; }

.login-footer {
  margin-top: 20px; text-align: center;
  font-size: 11px; color: rgba(167,139,202,0.5);
}

/* ─── SCANNER APP ───────────────────────────────────────── */
#scanner-app { display: none; min-height: 100vh; }

.header {
  background: rgba(10,0,20,0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header-left h1 { font-size: 15px; font-weight: 800; }
.header-left p  { font-size: 11px; color: var(--text2); margin-top: 1px; }
.logout-btn {
  padding: 6px 12px; border-radius: 8px;
  background: rgba(124,58,237,0.2); border: 1px solid var(--border);
  color: var(--text2); font-size: 11px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}

.container { max-width: 480px; margin: 0 auto; padding: 16px; }

/* Stats bar */
.stats-bar {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-bottom: 16px;
}
.stats-mini {
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 12px; padding: 10px 8px; text-align: center;
}
.stats-mini .n { font-size: 22px; font-weight: 800; line-height: 1; }
.stats-mini .l { font-size: 10px; color: var(--text2); margin-top: 3px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }

/* Result card */
.result-card {
  display: none; margin-bottom: 16px; padding: 20px;
  border-radius: 16px; border: 2px solid transparent;
  background: var(--glass); backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px); text-align: center;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.result-card.valid   { border-color: var(--green); background: rgba(16,185,129,0.08); }
.result-card.used    { border-color: var(--red);   background: rgba(239,68,68,0.08);  }
.result-card.invalid { border-color: var(--yellow); background: rgba(245,158,11,0.08); }
.result-icon   { font-size: 40px; margin-bottom: 8px; }
.result-status { font-size: 13px; font-weight: 700; letter-spacing: 2px; opacity: 0.7; }
.result-name   { font-size: 20px; font-weight: 800; margin: 6px 0 2px; }
.result-uuid   { font-size: 12px; color: var(--text2); font-family: monospace; }
.result-msg    { font-size: 13px; color: var(--text2); margin: 8px 0 16px; }
.confirm-btn {
  padding: 12px 20px; border-radius: 12px; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer;
  font-family: inherit; margin: 4px; min-width: 120px;
  transition: opacity 0.15s; -webkit-appearance: none;
}
.confirm-btn:active { opacity: 0.8; }
.confirm-btn.admit { background: var(--green); color: #fff; }
.confirm-btn.clear { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text); }

/* Camera controls */
.cam-controls { display: flex; gap: 8px; margin-bottom: 12px; }
.cam-btn {
  flex: 1; padding: 11px 8px;
  border-radius: 12px; border: 1px solid var(--glass-border);
  background: var(--glass); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--text); font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit;
  transition: background 0.2s; -webkit-appearance: none;
}
.cam-btn.active { background: var(--accent); border-color: var(--accent); }

/* Camera */
.camera-section {
  position: relative; border-radius: 16px; overflow: hidden;
  margin-bottom: 16px; background: #000; aspect-ratio: 4/3;
}
#camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
#camera-canvas { display: none; }
.scan-overlay {
  position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center; pointer-events: none;
}
.scan-frame {
  width: 210px; height: 210px;
  border: 2px solid rgba(255,255,255,0.5); border-radius: 20px;
  box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
}
.scan-frame::before, .scan-frame::after {
  content: ''; position: absolute; width: 28px; height: 28px;
  border-color: var(--accent2); border-style: solid;
}
.scan-frame::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-radius: 10px 0 0 0; }
.scan-frame::after  { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-radius: 0 0 10px 0; }
.scan-line {
  position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent2), transparent);
  animation: scanLine 2s ease-in-out infinite;
}
@keyframes scanLine {
  0% { top: 8px; } 50% { top: calc(100% - 8px); } 100% { top: 8px; }
}
.camera-status {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 8px 12px; text-align: center;
  font-size: 12px; font-weight: 500; color: var(--text2);
  background: rgba(0,0,0,0.6);
}

/* Manual lookup */
.manual-section {
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 16px; padding: 16px; margin-bottom: 16px;
}
.manual-section h3 { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
.manual-row { display: flex; gap: 8px; }
.manual-input {
  flex: 1; padding: 11px 14px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
  border-radius: 10px; color: var(--text); font-size: 14px;
  font-family: inherit; outline: none; -webkit-appearance: none;
}
.manual-input:focus { border-color: var(--accent); }
.manual-btn {
  padding: 11px 16px; background: var(--accent); border: none;
  border-radius: 10px; color: #fff; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit; -webkit-appearance: none;
}
.search-result-item {
  padding: 10px 12px; margin-top: 8px; cursor: pointer;
  border-radius: 10px; background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  transition: background 0.15s;
}
.search-result-item:active { background: rgba(124,58,237,0.15); }
.search-result-item .r-name { font-size: 14px; font-weight: 700; }
.search-result-item .r-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
</style>
</head>
<body>

<!-- ── Login Screen ─────────────────────────────────────── -->
<div id="scanner-login">
  <div class="login-logo">
    <div class="badge">🎪 Gate Control · VIT Bhopal</div>
    <h1>Gate Scanner</h1>
    <p>Summer Fest 2026 · Entry Control</p>
  </div>

  <div class="login-card">
    <div class="field">
      <label for="s-user">Scanner Username</label>
      <input type="text" id="s-user" placeholder="e.g. scanner1"
             autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"/>
    </div>
    <div class="field">
      <label for="s-pass">Password</label>
      <input type="password" id="s-pass" placeholder="••••••••••••"
             autocomplete="current-password"/>
    </div>
    <button class="login-btn" id="login-btn" onclick="scannerLogin()">Enter →</button>
    <div class="s-err" id="s-err"></div>
  </div>

  <div class="login-footer" id="login-footer" onclick="footerTap()">🔒 Secured · Summer Fest 2026 Backend</div>

<!-- Hidden config panel (tap footer 5x to open) -->
<div id="cfg-panel" style="display:none;margin-top:16px;width:100%;max-width:380px">
  <div style="background:rgba(255,255,255,0.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:16px;">
    <p style="font-size:11px;color:var(--text2);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px">⚙ Backend URL</p>
    <input id="cfg-url" type="url" placeholder="https://your-app.onrender.com"
      style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--text);font-size:13px;margin-bottom:8px;font-family:inherit;outline:none"
      value=""/>
    <div style="display:flex;gap:8px">
      <button onclick="saveCfg()" style="flex:1;padding:10px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer">Save & Reload</button>
      <button onclick="clearCfg()" style="padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--text2);cursor:pointer">Clear</button>
    </div>
    <p style="font-size:10px;color:rgba(167,139,202,0.5);margin-top:8px">Current: <span id="cfg-cur" style="color:var(--accent2)"></span></p>
  </div>
</div>
</div>

<!-- ── Scanner App (hidden until login) ──────────────────── -->
<div id="scanner-app">
  <div class="header">
    <div class="header-left">
      <h1>🎟 Summer Fest 2026 – Entry Gate</h1>
      <p id="header-sub">Scan QR code to grant entry</p>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stats-mini"><div class="n" id="sc-valid"   style="color:var(--green)">0</div><div class="l">Admitted</div></div>
      <div class="stats-mini"><div class="n" id="sc-used"    style="color:var(--red)">0</div><div class="l">Duplicate</div></div>
      <div class="stats-mini"><div class="n" id="sc-invalid" style="color:var(--yellow)">0</div><div class="l">Invalid</div></div>
    </div>

    <!-- Result card -->
    <div class="result-card" id="result-card">
      <div class="result-icon" id="r-icon">✅</div>
      <div class="result-status" id="r-status">VALID</div>
      <div class="result-name" id="r-name"></div>
      <div class="result-uuid" id="r-uuid"></div>
      <div class="result-msg" id="r-msg"></div>
      <div id="r-actions"></div>
    </div>

    <!-- Camera controls -->
    <div class="cam-controls">
      <button class="cam-btn active" id="btn-camera" onclick="startCamera()">📷 Camera</button>
      <button class="cam-btn" id="btn-manual" onclick="focusManual()">⌨ Manual</button>
      <button class="cam-btn" style="flex:0;padding:11px 14px" onclick="clearResult()">✕</button>
    </div>

    <!-- Camera section -->
    <div class="camera-section" id="camera-section">
      <video id="camera-video" autoplay playsinline muted></video>
      <canvas id="camera-canvas"></canvas>
      <div class="scan-overlay">
        <div class="scan-frame">
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="camera-status" id="cam-status">Starting camera…</div>
    </div>

    <!-- Manual search -->
    <div class="manual-section">
      <h3>🔍 Manual Lookup</h3>
      <div class="manual-row">
        <input type="text" class="manual-input" id="manual-query"
               placeholder="Name, email, or Ticket UUID…"
               oninput="debounceSearch()"
               onkeydown="if(event.key==='Enter')manualLookup()"/>
        <button class="manual-btn" onclick="manualLookup()">Search</button>
      </div>
      <div id="search-results"></div>
    </div>
  </div>
</div>

<script>
const API_BASE = (localStorage.getItem('sf_api_base') || '').replace(/\/+$/, '');

let TOKEN = '';
let scanning = false;
let videoStream = null;
let scanStats = { valid: 0, used: 0, invalid: 0 };
let lastScanned = '';
let searchTimer = null;

// ── Hidden config panel (tap footer 5x) ───────────────────────
let _footerTaps = 0, _footerTimer = null;
function footerTap() {
  clearTimeout(_footerTimer);
  _footerTaps++;
  _footerTimer = setTimeout(() => { _footerTaps = 0; }, 2000);
  if (_footerTaps >= 5) {
    _footerTaps = 0;
    const panel = document.getElementById('cfg-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    document.getElementById('cfg-url').value = localStorage.getItem('sf_api_base') || '';
    document.getElementById('cfg-cur').textContent = API_BASE;
  }
}
function saveCfg() {
  const v = document.getElementById('cfg-url').value.trim();
  if (!v.startsWith('http')) { alert('Must start with https://'); return; }
  localStorage.setItem('sf_api_base', v);
  location.reload();
}
function clearCfg() { localStorage.removeItem('sf_api_base'); location.reload(); }

// ── Login ──────────────────────────────────────────────────────
async function scannerLogin() {
  const u   = document.getElementById('s-user').value.trim();
  const p   = document.getElementById('s-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('s-err');
  err.className = 's-err';
  err.textContent = '';
  btn.textContent = 'Signing in…';
  btn.disabled = true;
  try {
    const r = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login failed');
    if (d.role !== 'scanner' && d.role !== 'admin') throw new Error('Not a scanner account');
    TOKEN = d.token;
    document.getElementById('scanner-login').style.display = 'none';
    document.getElementById('scanner-app').style.display   = 'block';
    document.getElementById('header-sub').textContent = `${u} · 🌐 Live`;
    startCamera();
  } catch(e) {
    err.textContent = e.message;
    err.className = 's-err show';
  } finally {
    btn.textContent = 'Enter →';
    btn.disabled = false;
  }
}

function logout() {
  if (!confirm('Log out?')) return;
  TOKEN = ''; scanning = false;
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
  document.getElementById('scanner-app').style.display  = 'none';
  document.getElementById('scanner-login').style.display = 'flex';
  document.getElementById('s-pass').value = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !TOKEN) scannerLogin();
});

// ── Camera ─────────────────────────────────────────────────────
async function startCamera() {
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); }
  const video  = document.getElementById('camera-video');
  const status = document.getElementById('cam-status');
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = videoStream;
    await video.play();
    status.textContent = '🟢 Camera active – point at QR code';
    scanning = true;
    requestAnimationFrame(tick);
  } catch(e) {
    status.textContent = '❌ Camera error: ' + e.message;
  }
}

function tick() {
  if (!scanning) return;
  const video  = document.getElementById('camera-video');
  const canvas = document.getElementById('camera-canvas');
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
    if (code && code.data && code.data !== lastScanned) {
      lastScanned = code.data;
      handleQRScan(code.data);
      setTimeout(() => { lastScanned = ''; }, 4000);
    }
  }
  requestAnimationFrame(tick);
}

function focusManual() { document.getElementById('manual-query').focus(); }

// ── QR scan handler ────────────────────────────────────────────
async function handleQRScan(token) {
  const status = document.getElementById('cam-status');
  status.textContent = '⏳ Verifying…';
  try {
    // Use GET with encoded token — if JWT is too long, fall back gracefully
    const url = `${API_BASE}/api/verify/` + encodeURIComponent(token);
    const r = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ message: 'Server error ' + r.status }));
      throw new Error(err.error || err.message || 'Verification failed');
    }
    const d = await r.json();
    status.textContent = '🟢 Camera active – point at QR code';
    showResult(d, token);
  } catch(e) {
    status.textContent = '🟢 Camera active – point at QR code';
    showResult({ status: 'INVALID', message: 'Error: ' + e.message }, token);
  }
}

function showResult(data, token) {
  const card = document.getElementById('result-card');
  card.style.display = 'block';
  const { status, name, ticket_uuid, message, used_at } = data;
  const iconEl   = document.getElementById('r-icon');
  const statusEl = document.getElementById('r-status');
  const nameEl   = document.getElementById('r-name');
  const uuidEl   = document.getElementById('r-uuid');
  const msgEl    = document.getElementById('r-msg');
  const actEl    = document.getElementById('r-actions');

  if (status === 'VALID') {
    card.className = 'result-card valid';
    iconEl.textContent   = '✅';
    statusEl.textContent = 'VALID TICKET';
    nameEl.textContent   = name || 'Unknown';
    uuidEl.textContent   = ticket_uuid || token || '';
    msgEl.textContent    = 'Ticket is valid. Confirm entry?';
    // Use ticket_uuid from response; fall back to the raw scanned value
    const admitId = ticket_uuid || token;
    actEl.innerHTML = `
      <button class="confirm-btn admit" onclick="admitUser('${esc(admitId)}')">✓ Admit Entry</button>
      <button class="confirm-btn clear" onclick="clearResult()">Cancel</button>
    `;
    vibrate([50]);
  } else if (status === 'ALREADY_USED') {
    card.className = 'result-card used';
    iconEl.textContent   = '🚫';
    statusEl.textContent = 'ALREADY USED';
    nameEl.textContent   = name || '';
    uuidEl.textContent   = ticket_uuid || '';
    msgEl.textContent    = `Used at: ${used_at ? new Date(used_at).toLocaleTimeString('en-IN') : 'unknown'}`;
    actEl.innerHTML = `<button class="confirm-btn clear" onclick="clearResult()">Dismiss</button>`;
    scanStats.used++;
    vibrate([100, 50, 100]);
  } else {
    card.className = 'result-card invalid';
    iconEl.textContent   = '❌';
    statusEl.textContent = 'INVALID';
    nameEl.textContent   = '';
    uuidEl.textContent   = '';
    msgEl.textContent    = message || 'Invalid or fake ticket';
    actEl.innerHTML = `<button class="confirm-btn clear" onclick="clearResult()">Dismiss</button>`;
    scanStats.invalid++;
    vibrate([200]);
  }
  updateStats();
}

async function admitUser(ticketId) {
  try {
    const r = await fetch(`${API_BASE}/api/check-in/` + encodeURIComponent(ticketId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN }
    });
    const d = await r.json();
    if (d.status === 'VALID') {
      scanStats.valid++;
      updateStats();
      document.getElementById('r-msg').textContent = '✅ Entry granted! Welcome ' + (d.name||'') + '!';
      document.getElementById('r-actions').innerHTML = '<button class="confirm-btn clear" onclick="clearResult()">Next →</button>';
    } else if (d.status === 'ALREADY_USED') {
      document.getElementById('result-card').className = 'result-card used';
      document.getElementById('r-status').textContent  = 'ALREADY USED';
      document.getElementById('r-msg').textContent     = 'Was just used by someone else!';
      scanStats.used++;
      updateStats();
    }
  } catch(e) {
    document.getElementById('r-msg').textContent = 'Network error – try again';
  }
}

function clearResult() {
  const card = document.getElementById('result-card');
  card.style.display = 'none';
  card.className = 'result-card';
  lastScanned = '';
}

// ── Manual search ──────────────────────────────────────────────
function debounceSearch() {
  clearTimeout(searchTimer);
  const q = document.getElementById('manual-query').value.trim();
  if (q.length < 2) { document.getElementById('search-results').innerHTML = ''; return; }
  searchTimer = setTimeout(manualLookup, 400);
}

async function manualLookup() {
  const q = document.getElementById('manual-query').value.trim();
  if (!q) return;
  const resultsEl = document.getElementById('search-results');
  resultsEl.innerHTML = '<p style="font-size:12px;color:var(--text2);padding:8px 0">Searching…</p>';
  try {
    const r = await fetch(`${API_BASE}/api/search-ticket?q=` + encodeURIComponent(q), {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    if (!r.ok) throw new Error('Server error ' + r.status);
    const d = await r.json();
    if (!d.results || !d.results.length) {
      resultsEl.innerHTML = '<p style="font-size:12px;color:var(--text2);padding:8px 0">No results — try name, email, reg no, or ticket ID</p>';
      return;
    }
    resultsEl.innerHTML = d.results.map(t => `
      <div class="search-result-item" onclick="selectManualResult('${esc(t.ticket_uuid)}')">
        <div class="r-name">${esc(t.name || 'Unknown')} &nbsp;${t.is_used ? '🚫 USED' : '✅ VALID'}</div>
        <div class="r-meta">${esc(t.email || '')}${t.phone ? ' · ' + esc(t.phone) : ''} · <span style="color:var(--accent2)">${esc(t.ticket_uuid)}</span></div>
      </div>
    `).join('');
  } catch(e) {
    resultsEl.innerHTML = '<p style="font-size:12px;color:var(--red);padding:8px 0">Error: ' + esc(e.message) + '</p>';
  }
}

async function selectManualResult(uuid) {
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('manual-query').value = '';
  const r = await fetch(`${API_BASE}/api/verify/` + encodeURIComponent(uuid), {
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  });
  const d = await r.json();
  showResult(d, uuid);
}

// ── Stats ──────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('sc-valid').textContent   = scanStats.valid;
  document.getElementById('sc-used').textContent    = scanStats.used;
  document.getElementById('sc-invalid').textContent = scanStats.invalid;
}

// ── Utilities ─────────────────────────────────────────────────
function vibrate(pattern) { if ('vibrate' in navigator) navigator.vibrate(pattern); }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&#34;');
}
</script>

</html>
